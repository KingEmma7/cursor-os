name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check scripts
        run: |
          node --check scripts/init.mjs
          node --check scripts/detect.mjs
          node --check scripts/smoke-test.mjs
      - name: Validate package.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Preview npm package contents
        run: npm run pack:dry-run

      - name: E2E — install from tarball and run the bin
        run: |
          npm pack
          mkdir -p /tmp/e2e/proj
          cd /tmp/e2e
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/cursor-os-*.tgz
          ./node_modules/.bin/cursor-os init --target ./proj
          ./node_modules/.bin/cursor-os doctor --target ./proj
          ./node_modules/.bin/cursor-os detect --target ./proj --format json | grep -q '"schemaVersion": 1'
          # bare invocation must print help and write nothing
          ./node_modules/.bin/cursor-os | grep -q "Usage:"
          # the install manifest must ship so --update can tell stale from edited
          test -f ./proj/.cursor/.cursor-os-manifest.json
          # pruning an opt-in rule is a supported end state, not a broken install
          rm ./proj/.cursor/rules/frontend.mdc
          ./node_modules/.bin/cursor-os doctor --target ./proj | grep -q "pruned"
          ./node_modules/.bin/cursor-os doctor --target ./proj
          # a mistyped multi-level target must be refused, not fabricated
          ! ./node_modules/.bin/cursor-os init --target ./no/such/tree
          test ! -d ./no
          # --update is a no-op preview on an unmodified install
          ./node_modules/.bin/cursor-os init --update --dry-run --target ./proj
          # programmatic import must resolve
          node -e "import('cursor-os').then(m => { if (typeof m.install !== 'function' || typeof m.doctor !== 'function' || typeof m.detect !== 'function') process.exit(1); }).catch(() => process.exit(1))"

  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
